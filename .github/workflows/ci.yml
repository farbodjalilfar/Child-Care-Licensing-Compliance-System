name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test --no-build --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults

  security-scan:
    name: Dependency scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Fail on vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages detected."
            exit 1
          fi

      - name: Report deprecated packages
        continue-on-error: true
        run: dotnet list package --deprecated

  database:
    name: Migrations and stored procedures
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Your_strong_Passw0rd!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Your_strong_Passw0rd!' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    env:
      MSSQL_SA_PASSWORD: "Your_strong_Passw0rd!"
      ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=ChildCareLicensing;User Id=sa;Password=Your_strong_Passw0rd!;TrustServerCertificate=True;Encrypt=False"

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef

      - name: Apply migrations
        run: >
          dotnet ef database update
          --project src/ChildCareLicensing.Infrastructure
          --startup-project src/ChildCareLicensing.Api

      - name: Verify reporting stored procedures run
        run: |
          docker exec ${{ job.services.sqlserver.id }} \
            /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C \
            -d ChildCareLicensing -b -Q "
              SET NOCOUNT ON;
              IF OBJECT_ID('dbo.usp_ViolationsByCategory') IS NULL
                THROW 50000, 'usp_ViolationsByCategory is missing', 1;
              IF OBJECT_ID('dbo.usp_FacilityComplianceSummary') IS NULL
                THROW 50000, 'usp_FacilityComplianceSummary is missing', 1;
              EXEC dbo.usp_FacilityComplianceSummary;
              EXEC dbo.usp_ViolationsByCategory @LookbackDays = 365;
              PRINT 'Reporting procedures executed successfully.';"
